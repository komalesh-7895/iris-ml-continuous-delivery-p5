name: Iris ML Continuous Delivery

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train Iris model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run ML pipeline tests
        run: python -m pytest test_ml_pipeline.py -v

      - name: Run prediction API tests
        run: python -m unittest test_app.py -v

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp iris_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          printf "Iris Prediction Application\nRun: python app.py\nHealth endpoint: /\nPrediction endpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: iris-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
